name: Check live site (temporary)
on:
  push:
    branches: [claude/football-dashboard-matches-standings-1yrjz2]
    paths: [.github/workflows/e2e.yml]
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          npm i --silent playwright@1.48.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > t.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch(); const p = await b.newPage();
            const errs = []; p.on('pageerror', e => errs.push(e.message));
            const t = async (sel) => (await p.locator(sel).innerText()).replace(/\s+/g, ' ').slice(0, 700);
            await p.goto('https://gauravadhi7756-beep.github.io/Football/?v=' + Date.now());
            await p.waitForSelector('#matches .league-block, #matches .empty, #matches .error', { timeout: 30000 });
            console.log('DAY STRIP:', await t('#summary-strip')); console.log('DAY:', await t('#matches'));
            await p.click('[data-range=week]'); await p.waitForSelector('#matches .league-block, #matches .empty, #matches .error', { timeout: 30000 }); await p.waitForTimeout(3000);
            console.log('WEEK STRIP:', await t('#summary-strip')); console.log('WEEK:', await t('#matches'));
            await p.goto('https://gauravadhi7756-beep.github.io/Football/#date=2026-09-27'); await p.reload(); await p.waitForSelector('.match', { timeout: 30000 });
            console.log('SEP27:', await t('#summary-strip'));
            await p.locator('.match').filter({ hasText: 'FT' }).first().click(); await p.waitForSelector('.mh-score'); await p.waitForTimeout(1500);
            console.log('MODAL:', (await t('#modal-body')).slice(0, 700)); await p.click('#modal-close');
            await p.click('[data-view=standings]'); await p.waitForSelector('table.standings', { timeout: 30000 }); await p.waitForTimeout(3000);
            console.log('TABLES blocks:', await p.locator('#standings .league-block').count(), 'rows:', await p.locator('#standings tbody tr').count());
            console.log('EPL:', (await p.locator('#standings .league-block').nth(2).innerText()).replace(/\s+/g, ' ').slice(0, 300));
            await p.click('[data-view=scorers]'); await p.waitForSelector('.leaders-grid', { timeout: 30000 }); await p.waitForTimeout(3000);
            console.log('SCORERS:', (await t('#scorers')).slice(0, 500));
            await p.click('[data-view=news]'); await p.waitForSelector('.news-card', { timeout: 30000 });
            console.log('NEWS cards:', await p.locator('.news-card').count());
            console.log('ERRORS:', errs); await b.close();
          })().catch(e => { console.error('FAILED', e.message); process.exit(1); });
          JS
          node t.js
