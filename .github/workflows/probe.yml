name: Probe player data (temporary)
on:
  push:
    branches: [claude/football-dashboard-matches-standings-1yrjz2]
    paths: [.github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          W=https://site.web.api.espn.com
          curl -sS --compressed "$W/apis/site/v2/sports/soccer/eng.1/statistics" > st.json
          python3 - <<'PY'
          import json
          d=json.load(open('st.json'))
          leaders=[l for c in d['stats'] if c['name']=='goalsLeaders' for l in c['leaders'][:3]]
          for l in leaders: print('LEADER', l['athlete']['id'], l['athlete']['displayName'], (l['athlete'].get('team') or {}).get('displayName'), l.get('displayValue'))
          open('ids.txt','w').write('\n'.join(l['athlete']['id'] for l in leaders))
          PY
          ID=$(head -1 ids.txt)
          echo "== core athlete profile $ID"
          curl -sS --compressed -o a.json -w "%{http_code} %{content_type}\n" -H "Origin: https://gauravadhi7756-beep.github.io" "https://sports.core.api.espn.com/v2/sports/soccer/leagues/eng.1/athletes/$ID" ; head -c 600 a.json; echo
          for u in "$W/apis/common/v3/sports/soccer/athletes/$ID" "$W/apis/common/v3/sports/soccer/athletes/$ID/news" "$W/apis/site/v2/sports/soccer/eng.1/news?athlete=$ID"; do
            echo "== $u"; curl -sS --compressed -D h.txt -o b.json "$u"; grep -iE "^HTTP|access-control-allow-origin" h.txt; python3 -c "
          import json
          try:
            d=json.load(open('b.json'))
          except Exception as e:
            print('not json', open('b.json','rb').read()[:120]); raise SystemExit
          print('KEYS', list(d.keys())[:20])
          a=d.get('athlete') or d
          for k in ['displayName','position','citizenship','flag','birthPlace','age','displayHeight','headshot','team','jersey','links']:
            v=a.get(k)
            if v is not None: print('  ', k, json.dumps(v)[:250])
          arts=d.get('articles') or d.get('news') or []
          print('  articles', len(arts), json.dumps(arts[0])[:200] if arts else '')
          "
          done
          echo "== wikipedia"
          for n in Ivan_Toney Erling_Haaland; do curl -sS -D wh.txt -o w.json "https://en.wikipedia.org/api/rest_v1/page/summary/$n"; grep -iE "^HTTP|access-control" wh.txt; python3 -c "import json; d=json.load(open('w.json')); print(d.get('title'), '|', (d.get('extract') or '')[:200], '|', (d.get('thumbnail') or {}).get('source'))"; done
