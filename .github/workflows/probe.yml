name: Probe ESPN API (temporary)
on:
  push:
    branches: [claude/football-dashboard-matches-standings-1yrjz2]
    paths: [.github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          B=https://site.api.espn.com
          for l in eng.1 uefa.nations; do for d in 20261010 20261009 20260927 20260926 20260920; do curl -sS --compressed "$B/apis/site/v2/sports/soccer/$l/scoreboard?dates=$d" > sb_${l}_$d.json; done; done
          for f in sb_*.json; do echo "$f $(python3 -c "import json; print(len(json.load(open('$f')).get('events',[])))")"; done
          python3 - <<'PY'
          import json,glob,urllib.request,gzip
          evs=[e for f in sorted(glob.glob('sb_*.json')) for e in json.load(open(f)).get('events',[])]
          print('events', len(evs))
          e=[x for x in evs if x['status']['type']['state']=='post'][-1]
          LG=[f.split('_')[1] for f in sorted(glob.glob('sb_*.json')) if any(x['id']==e['id'] for x in json.load(open(f)).get('events',[]))][0]
          print('USING', LG, e['name'], e['date'])
          c=e['competitions'][0]
          print('STATUS', json.dumps(e['status'])[:500])
          print('COMP KEYS', list(c.keys()))
          print('NOTES', c.get('notes'), 'VENUE', json.dumps(c.get('venue'))[:200])
          print('COMPETITOR', json.dumps({k:v for k,v in c['competitors'][0].items() if k not in ('statistics','leaders')})[:900])
          r=urllib.request.urlopen('https://site.api.espn.com/apis/site/v2/sports/soccer/'+LG+'/summary?event='+e['id']); b=r.read()
          try: b=gzip.decompress(b)
          except Exception: pass
          d=json.loads(b)
          print('SUMMARY KEYS', list(d.keys()))
          hc=d['header']['competitions'][0]
          print('HEADER COMP KEYS', list(hc.keys())); print('HDR COMPETITOR', json.dumps({k:v for k,v in hc['competitors'][0].items() if k!='linescores'})[:700])
          ke=d.get('keyEvents') or []
          print('KEYEVENTS', len(ke))
          for k in ke[:6]: print('  KE', json.dumps({x:k.get(x) for x in ('type','clock','team','text','shortText','participants','scoringPlay')})[:500])
          bt=d.get('boxscore',{}).get('teams',[])
          if bt: print('BOX TEAM', json.dumps(bt[0]['team'])[:200]); print('BOX STATS', [(s.get('name'),s.get('label'),s.get('displayValue')) for s in bt[0].get('statistics',[])])
          ro=d.get('rosters',[])
          if ro: print('ROSTER META', json.dumps({k:v for k,v in ro[0].items() if k!='roster'})[:400]); print('PLAYER', json.dumps(ro[0]['roster'][0])[:700])
          print('GAMEINFO', json.dumps(d.get('gameInfo'))[:600])
          h=d.get('headToHeadGames') or []
          print('H2H', json.dumps(h[0] if h else None)[:900])
          PY
