name: Probe Saudi league (temporary)
on:
  push:
    branches: [claude/football-dashboard-matches-standings-1yrjz2]
    paths: [.github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          B=https://site.web.api.espn.com
          curl -sS --compressed "$B/apis/site/v2/sports/soccer/ksa.1/scoreboard" > sb.json
          python3 -c "
          import json; d=json.load(open('sb.json')); l=d['leagues'][0]
          print('LEAGUE', l.get('name'), l.get('abbreviation'), [x.get('href') for x in l.get('logos',[])])
          print('EVENTS', len(d.get('events',[])), [e['name'] for e in d.get('events',[])][:5])"
          for d in 20261009 20261010 20261011 20261016 20261017; do echo "$d $(curl -sS --compressed "$B/apis/site/v2/sports/soccer/ksa.1/scoreboard?dates=$d" | python3 -c 'import json,sys; print([e["name"] for e in json.load(sys.stdin).get("events",[])])')"; done
          curl -sS --compressed "$B/apis/v2/sports/soccer/ksa.1/standings" | python3 -c "
          import json,sys; d=json.load(sys.stdin); ch=d.get('children',[])
          print('STANDINGS groups', len(ch), [c.get('name') for c in ch])
          for e in (ch[0]['standings']['entries'] if ch else [])[:5]: print('  ', e['team']['displayName'], [s.get('displayValue') for s in e['stats'] if s['name'] in ('gamesPlayed','points')], e.get('note'))"
          curl -sS --compressed "$B/apis/site/v2/sports/soccer/ksa.1/statistics" | python3 -c "
          import json,sys; d=json.load(sys.stdin)
          for c in d.get('stats',[]):
            print(c['name'], [(x['athlete']['displayName'], x.get('value'), (x['athlete'].get('team') or {}).get('displayName')) for x in c.get('leaders',[])[:5]])"
          curl -sS --compressed "$B/apis/site/v2/sports/soccer/ksa.1/news?limit=5" | python3 -c "import json,sys; print('NEWS', len(json.load(sys.stdin).get('articles',[])))"
